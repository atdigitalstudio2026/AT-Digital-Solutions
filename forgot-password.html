<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Kata Sandi - AT Digital</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="ambient-bg">
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card" id="forgotCard">
      <div class="auth-header">
        <div class="brand-badge">
          <div class="logo-icon">AT</div>
          <span class="brand-name">AT DIGITAL</span>
        </div>
        <h1 class="auth-title">Pemulihan Kata Sandi</h1>
        <p class="auth-subtitle">Masukkan email terdaftar Anda untuk menerima tautan instruksi reset password.</p>
      </div>

      <div id="alertError" class="alert alert-error" role="alert"></div>
      <div id="alertSuccess" class="alert alert-success" role="alert"></div>

      <!-- Forgot Password Form -->
      <form class="auth-form" id="forgotForm" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Alamat Email Terdaftar</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input 
              type="email" 
              id="email" 
              class="form-input" 
              placeholder="nama@perusahaan.com" 
              required
              autocomplete="email"
            >
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          <div class="spinner"></div>
          <span class="btn-text">Kirim link reset password</span>
        </button>
      </form>

      <div class="auth-footer">
        Ingat kata sandi Anda? <a href="login.html">Kembali ke halaman Masuk</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
