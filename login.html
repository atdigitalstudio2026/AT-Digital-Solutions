<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk ke Akun - AT Digital</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="ambient-bg">
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card" id="loginCard">
      <div class="auth-header">
        <div class="brand-badge">
          <div class="logo-icon">AT</div>
          <span class="brand-name">AT DIGITAL</span>
        </div>
        <h1 class="auth-title">Selamat Datang Kembali</h1>
        <p class="auth-subtitle">Masuk untuk mengakses lisensi dan software premium Anda</p>
      </div>

      <div id="alertError" class="alert alert-error" role="alert"></div>
      <div id="alertSuccess" class="alert alert-success" role="alert"></div>

      <!-- Google Authentication -->
      <button type="button" class="btn btn-google" id="googleBtn">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.38-2.27V6.58H1.25A11.96 11.96 0 0 0 0 12c0 1.92.45 3.74 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Masuk dengan Google</span>
      </button>

      <div class="auth-divider">
        <span>atau dengan email</span>
      </div>

      <!-- Email / Password Form -->
      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Alamat Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input 
              type="email" 
              id="email" 
              class="form-input" 
              placeholder="nama@perusahaan.com" 
              required
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-group">
          <div class="form-label">
            <label for="password">Kata Sandi</label>
            <a href="forgot-password.html" class="forgot-link">Lupa kata sandi?</a>
          </div>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              placeholder="••••••••" 
              required
              autocomplete="current-password"
            >
            <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="Lihat password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked>
            <span>Ingat saya di perangkat ini</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          <div class="spinner"></div>
          <span class="btn-text">Masuk ke Akun</span>
        </button>
      </form>

      <div class="auth-footer">
        Belum punya akun? <a href="register.html">Daftar sekarang</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
